name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
      - name: Audit development dependencies
        shell: pwsh
        run: |
          # Keep the production audit above independent. Remove this exception when picomatch ships a fix.
          $audit = npm audit --audit-level=high --json | ConvertFrom-Json
          if ($LASTEXITCODE -notin @(0, 1) -or $audit.error -or $null -eq $audit.metadata.vulnerabilities) {
            throw 'npm did not return a dependency audit.'
          }
          $advisories = @($audit.vulnerabilities.PSObject.Properties.Value.via | Where-Object { $_ -isnot [string] })
          $advisories | Select-Object name, severity, title, url | Format-Table -Wrap
          $high = @($advisories | Where-Object { $_.severity -in @('high', 'critical') })
          $unexpected = @($high | Where-Object { $_.name -ne 'picomatch' -or $_.severity -ne 'high' -or $_.url -ne 'https://github.com/advisories/GHSA-fc5q-39xc-vjpf' })
          if ($audit.metadata.vulnerabilities.critical -gt 0 -or $unexpected.Count -gt 0 -or ($audit.metadata.vulnerabilities.high -gt 0 -and $high.Count -eq 0)) {
            throw 'The development audit reported an unaccepted high or critical advisory.'
          }
          if ($high.Count -gt 0) { Write-Warning 'Accepted development-only advisory GHSA-fc5q-39xc-vjpf. No patched release is available.' }
          exit 0
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned secret scanner
        shell: bash
        run: |
          # GitHub release downloads sometimes time out; retry, then verify the checksum as before.
          curl --fail --location --silent --show-error --retry 5 --retry-delay 15 --retry-all-errors --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Check full history and current files
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all"
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --max-target-megabytes=2 .
