appId: app.riotbot.desktop
productName: Riot Bot
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - node_modules/playwright-core/**/*
npmRebuild: false
win:
  target:
    - nsis
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Riot-Bot-Setup-${version}.${ext}
